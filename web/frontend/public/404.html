<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | Pasig Knowledge Center</title>
    <link
      rel="icon"
      type="image/png"
      href="/assets/images/Pasig_City_Seal_Logo.png"
    />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #002248;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      .card {
        max-width: 30rem;
      }
      img {
        width: 4.5rem;
        height: 4.5rem;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.75rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0 0 1.75rem;
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.6;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border-radius: 0.5rem;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
      }
      .primary {
        background: #128cf1;
        color: #fff;
      }
      .primary:hover {
        background: #0e6bb8;
      }
      .secondary {
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #fff;
      }
      .secondary:hover {
        border-color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/assets/images/Pasig_City_Seal_Logo.png" alt="Pasig City seal" />
      <h1>We couldn't find that page</h1>
      <p>
        The link may be out of date, or the page may have moved. The catalogue
        is still right where you left it.
      </p>
      <div class="actions">
        <a class="primary" href="/opac/collections">Browse the catalogue</a>
        <a class="secondary" href="/opac/home">Go to the homepage</a>
      </div>
    </div>
  </body>
</html>
