<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasig Knowledge Center</title>

    <link
      rel="icon"
      type="image/png"
      href="/assets/images/Pasig_City_Seal_Logo.png"
    />
    <link rel="stylesheet" href="src/assets/global.css" />
    <!-- The one face the About masthead needs and Gotham cannot supply.
         Preconnected so the handoff does not wait on a fresh TLS handshake,
         and swapped so the heading paints in the fallback rather than
         holding the page blank if the request never lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
